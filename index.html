<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a101d" />
    <meta name="description" content="OPSDECK — field operations control platform. Dashboards, Gantt & S-curve planning, geo-tagging, approvals and runbooks for admins, clients and inspectors." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a101d'/%3E%3Cpath d='M9 11h5M9 11v5M23 21h-5M23 21v-5' stroke='%23ffb224' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%232fd6c3'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>OPSDECK · Operations Control Platform</title>
    <script>
      // apply saved theme before first paint to avoid flash
      (function () {
        try {
          var t = localStorage.getItem("opsdeck:theme");
          var light = t === "light" || (!t && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
        } catch (e) { /* storage unavailable */ }
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #0a101d; }
      html.light, html.light body { background: #eceff4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
